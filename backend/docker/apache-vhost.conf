<VirtualHost *:10000>
    DocumentRoot /var/www/html/public

    # Preserve mobile Bearer tokens for Laravel Sanctum. Apache can consume
    # Authorization itself unless it is explicitly passed to PHP.
    SetEnvIfNoCase Authorization "^(.+)$" HTTP_AUTHORIZATION=$1

    <Directory /var/www/html/public>
        CGIPassAuth On
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
