name: Android and Backend CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter Android validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Restore Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter application
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter compact

      - name: Build unsigned Android release bundle
        run: >-
          flutter build appbundle --release
          --dart-define=API_BASE_URL=https://syncrofit-api.onrender.com

  backend:
    name: Laravel validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Install locked backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel and validate migrations
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          # phpunit.xml retains an empty Unit suite; Git cannot track its directory.
          mkdir -p tests/Unit
          php artisan migrate:fresh --force --env=testing

      - name: Run Laravel test suites
        run: php artisan test
