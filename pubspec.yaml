name: synchrofit
description: SyncroFit fitness application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  uuid: ^4.4.0
  image_picker: ^1.1.2
  camera: ^0.11.2
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  glados: ^1.1.7
  sqflite_common_ffi: ^2.4.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1E2328"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
